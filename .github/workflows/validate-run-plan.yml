name: Validate run-plan

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate-run-plan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
      - name: Validate run-plan contract
        run: python3 tasks/validate_run_plan.py
