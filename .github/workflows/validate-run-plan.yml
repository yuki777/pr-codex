name: Validate run-plan

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-run-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
      - name: Validate run-plan contract
        run: python3 tasks/validate_run_plan.py
      - name: Run repository unit tests
        run: python3 -m unittest discover -s tasks -p 'test_*.py'
